# Runs that appear in the lab notebook. Order fixes each run's chart color
# (color follows the run, never its position in a figure), so append new runs
# at the end and never reorder.
#
# Add a finished run:
#   python reports/make_charts.py ingest runs\<run_dir> --label <label>
#   then add a [[run]] entry here and re-run:  python reports/make_charts.py charts

