# Same as the matching trial, with Layer 2 on: cells can bond to neighbors by mutual choice,
# energy evens out inside a bonded group, and a newborn starts bonded to its parent.
# Question: do bonds protect sharing from the selfish sweep?

# Trial C: trial B plus a season that travels across the world.
# Each place cycles between rich and poor every 600 ticks (about two lifespans),
# so conditions change within a cell's lifetime. That is the pressure that should
# favor learning during life over fixed behavior.
# Try season = "global" (everywhere at once) or "drift" (patches slide) for variants.

name = "trial_c_bonds"
seed = 0
ticks = 300000

[substrate]
grid = 128
inflow = 0.35
field = "patches"
contrast = 0.8
patch_scale = 16
field_seed = 1
season = "wave"
season_period = 600
season_amp = 0.6

[cell]
hidden = 32
msg = 8

[life]
seed_mode = "clone"
lifespan = 300

[layers]
plasticity = true
expression = "context"
layer3 = "on"
bonds = true

[observe]
metrics_every = 10
image_every = 100
rerun = "spawn"
