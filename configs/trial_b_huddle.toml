# Trial B with birth-only bonds, plus EXPOSURE: every tick a cell loses a small share of its
# energy through each face that is not bonded (like heat or water escaping a cell's surface).
# A bonded face is sealed, so cells inside a group lose little. No predator: a physical reason
# for a family to stay together, as with huddling for warmth.
# Question: does a private benefit of staying bonded keep family groups (and their sharing) together?

name = "trial_b_huddle"
seed = 0
ticks = 300000

[substrate]
grid = 128
inflow = 0.35
field = "patches"
contrast = 0.8
patch_scale = 16
field_seed = 1

[energy]
exposure_leak = 0.004

[cell]
hidden = 32
msg = 8

[life]
seed_mode = "clone"
lifespan = 300

[layers]
plasticity = true
expression = "context"
layer3 = "on"
bonds = true
bond_mode = "birth_only"

[observe]
metrics_every = 10
image_every = 100
rerun = "spawn"
